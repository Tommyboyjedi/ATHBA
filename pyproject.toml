[tool.poetry]
name = "athba"
version = "0.1.0"
description = "Complete TDD Devops Software Development Agentic AI Team"
authors = ["Tom Pearce"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
django = "<5.2"
django-ninja = "^1.4.1"
pymongo = "^4.12.1"
ollama = "^0.4.8"
django-environ = "^0.12.0"
psycopg = "^3.2.0"
llama-stack = "^0.2.4"
llama-stack-client = "^0.2.4"
starlette = "^0.46.2"
uvicorn = "^0.34.2"
autoevals = "^0.0.127"
llama-cpp-python = "^0.3.8"
httpx = "^0.27.0"
django-cors-headers = "^4.7.0"
motor = "^3.7.0"
fastapi = "^0.115.12"
psutil = "^7.0.0"
sse-starlette = "^2.3.5"
aiohttp = "^3.12.13"
gitpython = "^3.1.43"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.12.0"
pytest-django = "^4.8.0"
mypy = "^2.3.1"

[tool.mypy]
python_version = "3.14"
files = [
  "core/development/behavior_contract_coordinator.py",
  "core/development/specification_assessment.py",
  "core/development/specification_atomization.py",
  "core/development/specification_domain.py",
  "core/development/specification_evidence.py",
  "core/development/specification_gatekeeper.py",
  "core/development/specification_gap_adapter.py",
  "core/development/specification_reconciliation.py",
  "core/execution/provider_reasoning_gateway.py",
  "core/execution/reasoning_gateway.py",
  "core/llm/contracts/provider.py",
  "core/llm/providers/openai_provider.py",
  "core/llm/providers/anthropic_provider.py",
  "core/development/strict_tdd_transitions.py",
  "core/development/strict_tdd_transition_provenance.py",
  "core/development/strict_tdd_lifecycle_evidence.py",
  "core/development/strict_tdd_run_domain.py",
  "core/development/strict_tdd_run_store.py",
  "core/development/strict_tdd_run_reporting.py",
  "core/development/strict_tdd_run_controller.py",
  "core/development/strict_tdd_live_run_composition.py",
  "scripts/run_pr23_strict_tdd_feature.py",
  "core/development/strict_microcycle_advance.py",
  "core/development/strict_tdd_feature_execution_advance.py",
  "core/development/strict_tdd_feature_application_advance.py",
  "core/development/strict_microcycle.py",
  "core/development/behavior_repair.py",
  "core/development/scenario_drafting.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-W ignore::DeprecationWarning:pytest_asyncio.plugin -W ignore::DeprecationWarning:django.contrib.auth.decorators"
filterwarnings = [
  'ignore:There is no current event loop:DeprecationWarning',
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
