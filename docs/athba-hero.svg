<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ATHBA - From idea to working software</title>
  <desc id="desc">A simple three-step visual: describe your idea, ATHBA plans builds and tests it, then review working software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="160" fill="#1d4ed8" opacity="0.12"/>
  <circle cx="150" cy="330" r="180" fill="#0ea5e9" opacity="0.08"/>

  <text x="600" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#ffffff">ATHBA</text>
  <text x="600" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#cbd5e1">From idea to working software — with AI doing the heavy lifting</text>
  <rect x="480" y="132" width="240" height="4" rx="2" fill="url(#accent)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="182" width="310" height="120" rx="20" fill="#111827" stroke="#334155"/>
    <rect x="445" y="182" width="310" height="120" rx="20" fill="#111827" stroke="#334155"/>
    <rect x="820" y="182" width="310" height="120" rx="20" fill="#111827" stroke="#334155"/>
  </g>

  <circle cx="120" cy="224" r="23" fill="#0ea5e9"/>
  <text x="120" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">1</text>
  <text x="160" y="216" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Describe what you want</text>
  <text x="160" y="246" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#cbd5e1">Goals, features, constraints and priorities</text>
  <text x="160" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#cbd5e1">in normal product language.</text>

  <circle cx="495" cy="224" r="23" fill="#6366f1"/>
  <text x="495" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">2</text>
  <text x="535" y="216" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff">ATHBA builds it</text>
  <text x="535" y="246" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#cbd5e1">Plans, writes, tests, checks and improves</text>
  <text x="535" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#cbd5e1">the software with minimal supervision.</text>

  <circle cx="870" cy="224" r="23" fill="#8b5cf6"/>
  <text x="870" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">3</text>
  <text x="910" y="216" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Review the result</text>
  <text x="910" y="246" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#cbd5e1">Working, tested, version-controlled software</text>
  <text x="910" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#cbd5e1">with a clear record of what happened.</text>

  <path d="M392 242 H430" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M417 230 L431 242 L417 254" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M767 242 H805" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M792 230 L806 242 L792 254" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
